# Every push to main and every pull request: the tests that need no internet.
# Tests tagged @live (IRSA, sky-survey tiles) run on a schedule instead, in live.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the documented minimum; 3.15 is the current release.
        python: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m venv .venv && .venv/bin/python -m pip install -r backend/requirements.txt
      - name: Run tests
        run: .venv/bin/python -m pytest backend/tests -q

  frontend:
    name: Frontend unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        # Playwright starts the API from .venv, as on a developer machine.
        run: python -m venv .venv && .venv/bin/python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check for a browser
        # The runner image ships Google Chrome; fall back to Playwright's Chromium if it ever does not.
        working-directory: frontend
        run: |
          if [ -x /usr/bin/google-chrome ]; then /usr/bin/google-chrome --version
          else npx playwright install --with-deps chromium; fi
      - name: Run browser tests (no internet needed)
        run: npm run test:browser -- --grep-invert @live
        working-directory: frontend
      - name: Run developer validation-lab tests
        # The synthetic lab is hidden unless this flag is set when Vite starts, so it gets its own run.
        run: npm run test:browser -- tests/browser/validation-lab.spec.js
        working-directory: frontend
        env:
          VITE_ENABLE_DETECTION_LAB: 'true'
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7

# Weekly check of the tests that reach the real archive and sky-survey services (tagged @live).
# Kept off the push workflow so an IRSA or tile-server outage does not mark every change as broken.
# Run it by hand from the Actions tab; tick "fits" to include the opt-in real FITS downloads.
name: Live archive checks

on:
  schedule:
    - cron: '17 5 * * 1'  # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      fits:
        description: Also download real FITS cutouts from IRSA (opt-in tests)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    name: Live browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m venv .venv && .venv/bin/python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check for a browser
        working-directory: frontend
        run: |
          if [ -x /usr/bin/google-chrome ]; then /usr/bin/google-chrome --version
          else npx playwright install --with-deps chromium; fi
      - name: Run live browser tests
        run: npm run test:browser -- --grep @live
        working-directory: frontend
        env:
          SKYTRACKER_LIVE_FITS: ${{ inputs.fits && '1' || '' }}
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-test-results
          path: frontend/test-results/
          retention-days: 14
